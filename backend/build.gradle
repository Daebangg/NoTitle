buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        // Spring Boot 4.1.2가 관리하는 Flyway 버전과 일치시킨다.
        classpath 'org.flywaydb:flyway-mysql:12.4.0'
    }
}

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.flywaydb.flyway' version '12.4.0'
}

group = 'com.daebangg'
version = '0.0.1-SNAPSHOT'
description = 'sayroam'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.flywaydb:flyway-mysql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

// 앱/마이그레이션 명령은 개발 DB를 자동 기동하지 않는다. 테스트는 임시 DB를 사용한다.
def composeFile = layout.projectDirectory.file('../docker/compose.yaml').asFile
def composeEnvFile = layout.projectDirectory.file('../docker/.env').asFile

// local 프로필의 상대 경로 설정을 IDE/CLI에서 동일하게 해석한다.
tasks.named('bootRun') {
    workingDir layout.projectDirectory.asFile
}

apply from: 'gradle/flyway.gradle'
def composeTasks = [
    dockerInit: [description: 'Create and start local MySQL, waiting until healthy (preserves data).', args: ['up', '-d', '--wait', '--wait-timeout', '180']],
    dockerStop: [description: 'Stop local MySQL without removing containers or data.', args: ['stop']],
    dockerDown: [description: 'Remove local containers and network, preserving database volumes.', args: ['down']],
    dockerStatus: [description: 'Show local Docker Compose service status.', args: ['ps', '--all']],
    dockerLogs: [description: 'Show the last 100 lines of local MySQL logs.', args: ['logs', '--tail', '100', 'mysql']]
]

composeTasks.each { taskName, config ->
    tasks.register(taskName, Exec) {
        group = 'docker'
        description = config.description
        workingDir composeFile.parentFile
        commandLine(['docker', 'compose', '--env-file', composeEnvFile.absolutePath, '-f', composeFile.absolutePath] + config.args)
    }
}

// OpenAPI info.version에 Gradle 프로젝트 버전을 사용한다.
springBoot {
    buildInfo()
}

tasks.register('exportOpenApi') {
    group = 'documentation'
    description = 'Export OpenAPI from a running local app (-PapiDocsUrl=...).'
    doLast {
        def endpoint = providers.gradleProperty('apiDocsUrl').getOrElse('http://localhost:8080/v3/api-docs')
        def connection = URI.create(endpoint).toURL().openConnection()
        connection.connectTimeout = 5000
        connection.readTimeout = 10000
        def document
        try {
            def status = connection.responseCode
            if (status != 200) {
                throw new GradleException("OpenAPI 요청 실패: HTTP ${status} (${endpoint}). local 프로필과 서버 포트를 확인하세요. localhost의 IPv4/IPv6 서버가 다르면 -PapiDocsUrl로 주소를 명시하세요.")
            }
            document = connection.inputStream.withCloseable { it.getText('UTF-8') }
        } catch (IOException exception) {
            throw new GradleException("OpenAPI 서버 연결 실패 (${endpoint}). 앱을 local 프로필로 실행하고 -PapiDocsUrl로 실제 주소를 지정하세요.", exception)
        } finally {
            connection.disconnect()
        }
        def parsed = new groovy.json.JsonSlurper().parseText(document)
        if (!parsed.openapi || !parsed.info?.version || parsed.paths == null) {
            throw new GradleException('Response is not an OpenAPI document')
        }
        def output = layout.buildDirectory.file('openapi/openapi.json').get().asFile
        output.parentFile.mkdirs()
        output.text = groovy.json.JsonOutput.prettyPrint(document) + '\n'
        logger.lifecycle("OpenAPI ${parsed.info.version}: ${output}")
    }
}
