spring.application.name=sayroam

# 스키마 변경은 Gradle flywayMigrate로만 실행한다. 앱은 매핑을 검증한다.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never

# 검증 메시지 등 로케일 의존 메시지를 요청의 Accept-Language와 무관하게 영어로 고정
spring.web.locale=en
spring.web.locale-resolver=fixed

# API documentation is enabled only in the local profile by default.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# StringRedisTemplate을 사용하며 Redis Repository는 사용하지 않는다.
spring.data.redis.repositories.enabled=false
spring.data.redis.connect-timeout=3s
spring.data.redis.timeout=3s

# SMTP timeout 단위는 밀리초다. 기본적으로 시작 시 연결 검사를 끄며 외부 설정으로 재정의한다.
app.mail.enabled=false
spring.mail.default-encoding=UTF-8
spring.mail.test-connection=false
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000
