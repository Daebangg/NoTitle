name: sayroam

services:
    redis:
        image: redis:7.4-alpine
        command: ["redis-server", "--save", "", "--appendonly", "no"]
        ports:
            - "127.0.0.1:${REDIS_PORT:?Set REDIS_PORT in docker/.env}:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10
            start_period: 5s

    mysql:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME in docker/.env}
            MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in docker/.env}
            MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in docker/.env}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in docker/.env}
        ports:
            - "127.0.0.1:${DB_PORT:?Set DB_PORT in docker/.env}:3306"
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 30s

volumes:
    mysql-data:
