name: PR Discord Notify

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

jobs:
  notify:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          jq -n \
            --arg title "#$PR_NUMBER $PR_TITLE" \
            --arg url "$PR_URL" \
            --arg desc "$PR_AUTHOR 님이 PR을 올렸습니다: \`$HEAD\` → \`$BASE\`" \
            '{embeds: [{title: $title, url: $url, description: $desc, color: 5814783}]}' \
          | curl -sf -H "Content-Type: application/json" -d @- "$WEBHOOK_URL"
